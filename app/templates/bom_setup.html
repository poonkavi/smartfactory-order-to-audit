
<!DOCTYPE html>
<html>
<head>
    <title>BOM Setup - SmartFactory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Bill of Materials (BOM) Setup</h2>
        <a href="/production" class="btn btn-secondary">Production Planning</a>
    </div>

    <div class="card shadow-sm p-4">

        <h4 class="mb-3">Create Product Recipe</h4>

        <form method="POST">

            <!-- Product -->
            <div class="mb-3">
                <label class="form-label">Select Product</label>

                <select name="product_id" class="form-select" required>
                    <option value="">Choose Product</option>

                    {% for product in products %}
                    <option value="{{ product.id }}">
                        {{ product.name }} ({{ product.sku }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Batch size -->
            <div class="mb-3">
                <label class="form-label">Standard Batch Output</label>

                <input type="number"
                       name="batch_size"
                       class="form-control"
                       min="1"
                       required
                       placeholder="Example: 200 packets">
            </div>

            <hr>

            <h5>Raw Materials / Packaging</h5>

            <div id="materials-container">

                <div class="row mb-3 material-row">

                    <div class="col-md-6">
                        <label class="form-label">Inventory Item</label>

                        <select name="inventory_item_id[]" class="form-select" required>
                            <option value="">Select Material</option>

                            {% for item in inventory_items %}
                            <option value="{{ item.id }}">
                                {{ item.name }} ({{ item.item_code }}) - {{ item.unit }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Quantity Required</label>

                        <input type="number"
                               name="quantity_required[]"
                               class="form-control"
                               min="0.001"
                               step="0.001"
                               required
                               placeholder="Quantity">
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button"
                                class="btn btn-danger remove-material">
                            Remove
                        </button>
                    </div>

                </div>

            </div>

            <button type="button" id="add-material" class="btn btn-outline-primary mb-3">
                + Add Material
            </button>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">
                    Save BOM
                </button>
            </div>

        </form>

    </div>

</div>

<script>

    const container = document.getElementById("materials-container");
    const addButton = document.getElementById("add-material");

    addButton.addEventListener("click", function () {

        const firstRow = container.querySelector(".material-row");
        const newRow = firstRow.cloneNode(true);

        newRow.querySelector("select").selectedIndex = 0;
        newRow.querySelector("input").value = "";

        container.appendChild(newRow);

    });

    container.addEventListener("click", function (event) {

        if (event.target.classList.contains("remove-material")) {

            const rows = container.querySelectorAll(".material-row");

            if (rows.length > 1) {
                event.target.closest(".material-row").remove();
            } else {
                alert("At least one material is required.");
            }

        }

    });

</script>

</body>
</html>
